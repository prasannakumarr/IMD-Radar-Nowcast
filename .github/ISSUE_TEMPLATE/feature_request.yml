name: Feature request
description: Suggest a capability or an additional radar site
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For **new radar sites**, please read
        [Considered and rejected: Sriharikota](../blob/main/ANNEXURE.md#considered-and-rejected-sriharikota)
        first. A radar that mostly overlaps an existing one makes the fused
        output worse, not better.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation where the current behaviour falls short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional, but helpful — especially the parts you expect to be hard.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
